name: Changelog Enforcement

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  check-changelog:
    name: Verify CHANGELOG update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check CHANGELOG modification
        run: |
          # Skip automated bot commits (e.g., release automated commits)
          COMMIT_MSG=$(git log -1 --format='%s')
          if [[ "$COMMIT_MSG" == *"[skip ci]"* ]] || [[ "$COMMIT_MSG" == *"chore(changelog):"* ]]; then
            echo "Skipping CHANGELOG check for automated commit: $COMMIT_MSG"
            exit 0
          fi

          # Determine diff target depending on push vs pull_request event
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_TARGET="origin/${{ github.base_ref }}...HEAD"
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              DIFF_TARGET="HEAD~1 HEAD"
            else
              DIFF_TARGET="HEAD"
            fi
          fi

          if git diff --name-only $DIFF_TARGET | grep -q "^CHANGELOG.md$"; then
            echo "CHANGELOG.md was updated."
          else
            echo "::error::CHANGELOG.md has not been modified in this commit/pull request. Please update CHANGELOG.md."
            exit 1
          fi
